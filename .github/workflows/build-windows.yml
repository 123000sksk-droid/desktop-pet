
name: Build Windows App
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-windows.txt

      - name: Build exe
        run: pyinstaller --noconsole --onefile --add-data ".;assets" --name PixelPersonPet pixel_person_pet_windows.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: PixelPersonPet-Windows
          path: dist/PixelPersonPet.exe
